[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
# COSMIC is Linux-only
targets = ["x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "~/.local/bin"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false

# Build on the oldest supported Ubuntu so the binary's glibc requirement
# stays low enough for Pop!_OS and other distros
[dist.github-custom-runners]
x86_64-unknown-linux-gnu = "ubuntu-22.04"
global = "ubuntu-22.04"

# libcosmic needs these headers to build
[dist.dependencies.apt]
libxkbcommon-dev = "*"
libwayland-dev = "*"
